name: Deploy

# Deploys main to Azure (see infra/ and docs/AZURE_OPPSETT.md):
#
#   1. infra/main.bicep  — core infrastructure (idempotent, usually a no-op)
#   2. build + push the web, api, worker and migrate images to ACR
#   3. infra/apps.bicep  — migrate job only, then run it and wait
#   4. infra/apps.bicep  — web, api, worker and the retention job
#   5. smoke-check /health and the front page
#
# Manual trigger only: every run is a production deploy. Migrations run
# before new code starts, so they must stay backward compatible with the
# revision that is still serving (expand/contract, see docs/RUNBOOK.md).
#
# Configuration lives on the `production` GitHub environment:
#   variables  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#              AZURE_RESOURCE_GROUP, optional AZURE_PREFIX, APP_PUBLIC_URL,
#              API_PUBLIC_URL, METRICS_USERNAME,
#              NEXT_PUBLIC_TURNSTILE_SITE_KEY, NEXT_PUBLIC_SENTRY_DSN
#   secrets    POSTGRES_ADMIN_PASSWORD, optional ANTHROPIC_API_KEY,
#              METRICS_PASSWORD, TURNSTILE_SECRET_KEY, SENTRY_DSN
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC login to Azure — no stored Azure credentials

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      PREFIX: ${{ vars.AZURE_PREFIX || 'aya-prod' }}
      TAG: ${{ github.sha }}
    steps:
      - name: Check configuration
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          missing=""
          for v in CLIENT_ID TENANT_ID SUBSCRIPTION_ID RG POSTGRES_ADMIN_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing configuration on the production environment:$missing"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure CLI extensions
        run: az extension add --name containerapp --upgrade --yes --only-show-errors

      # Parameters go through a file rather than `-p key=value` so secrets
      # never hit a command line and values starting with `@` aren't read as
      # file paths by az.
      - name: Deploy core infrastructure
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          params="$RUNNER_TEMP/core.parameters.json"
          ( umask 077
            jq -n --arg prefix "$PREFIX" --arg pw "$POSTGRES_ADMIN_PASSWORD" '{
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              contentVersion: "1.0.0.0",
              parameters: { prefix: { value: $prefix }, postgresAdminPassword: { value: $pw } }
            }' > "$params" )
          az deployment group create \
            --resource-group "$RG" \
            --name "core-$GITHUB_RUN_ID" \
            --template-file infra/main.bicep \
            --parameters "@$params" \
            --query properties.outputs --output json > "$RUNNER_TEMP/core.outputs.json"
          rm -f "$params"

          out() { jq -r ".$1.value" "$RUNNER_TEMP/core.outputs.json"; }
          domain="$(out environmentDefaultDomain)"
          {
            echo "REGISTRY_NAME=$(out registryName)"
            echo "REGISTRY=$(out registryLoginServer)"
            echo "MIGRATE_JOB=$(out migrateJobName)"
            echo "API_URL=${{ vars.API_PUBLIC_URL }}"
            echo "APP_URL=${{ vars.APP_PUBLIC_URL }}"
            echo "DEFAULT_API_URL=https://$(out apiAppName).$domain"
            echo "DEFAULT_APP_URL=https://$(out webAppName).$domain"
          } >> "$GITHUB_ENV"

      # Until a custom domain is attached, both apps are reached on their
      # Container Apps default hostnames, which are known before the apps exist.
      - name: Resolve public URLs
        run: |
          echo "API_URL=${API_URL:-$DEFAULT_API_URL}" >> "$GITHUB_ENV"
          echo "APP_URL=${APP_URL:-$DEFAULT_APP_URL}" >> "$GITHUB_ENV"

      - name: Log in to the container registry
        run: az acr login --name "$REGISTRY_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/db/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/migrate:${{ env.TAG }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/api:${{ env.TAG }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/worker:${{ env.TAG }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      # NEXT_PUBLIC_* are inlined at build time (client bundle + CSP), so the
      # web image is specific to the URLs it was built for.
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/web:${{ env.TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.API_URL }}
            NEXT_PUBLIC_APP_URL=${{ env.APP_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
            NEXT_PUBLIC_SENTRY_RELEASE=${{ env.TAG }}

      # Custom domains are bound outside Bicep (they need DNS first), so pass
      # the live bindings back in — otherwise each deploy would drop them.
      - name: Read bound custom domains
        run: |
          domains() {
            az containerapp show --resource-group "$RG" --name "$PREFIX-$1" \
              --query 'properties.configuration.ingress.customDomains' --output json 2>/dev/null \
              | jq -c '. // []' || echo '[]'
          }
          echo "WEB_DOMAINS=$(domains web)" >> "$GITHUB_ENV"
          echo "API_DOMAINS=$(domains api)" >> "$GITHUB_ENV"

      - name: Write app parameters
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          METRICS_USERNAME: ${{ vars.METRICS_USERNAME }}
          METRICS_PASSWORD: ${{ secrets.METRICS_PASSWORD }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL }}
        run: |
          umask 077
          jq -n \
            --arg prefix "$PREFIX" \
            --arg web "$REGISTRY/web:$TAG" \
            --arg api "$REGISTRY/api:$TAG" \
            --arg worker "$REGISTRY/worker:$TAG" \
            --arg migrate "$REGISTRY/migrate:$TAG" \
            --arg appUrl "$APP_PUBLIC_URL" \
            --argjson webDomains "${WEB_DOMAINS:-[]}" \
            --argjson apiDomains "${API_DOMAINS:-[]}" \
            --arg pw "$POSTGRES_ADMIN_PASSWORD" \
            --arg anthropic "$ANTHROPIC_API_KEY" \
            --arg metricsUser "$METRICS_USERNAME" \
            --arg metricsPw "$METRICS_PASSWORD" \
            --arg turnstile "$TURNSTILE_SECRET_KEY" \
            --arg sentry "$SENTRY_DSN" \
            --arg release "$TAG" \
            '{
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              contentVersion: "1.0.0.0",
              parameters: {
                prefix: { value: $prefix },
                webImage: { value: $web },
                apiImage: { value: $api },
                workerImage: { value: $worker },
                migrateImage: { value: $migrate },
                appUrl: { value: $appUrl },
                webCustomDomains: { value: $webDomains },
                apiCustomDomains: { value: $apiDomains },
                postgresAdminPassword: { value: $pw },
                anthropicApiKey: { value: $anthropic },
                metricsUsername: { value: $metricsUser },
                metricsPassword: { value: $metricsPw },
                turnstileSecretKey: { value: $turnstile },
                sentryDsn: { value: $sentry },
                release: { value: $release }
              }
            }' > "$RUNNER_TEMP/apps.parameters.json"

      - name: Update migrate job
        run: |
          az deployment group create \
            --resource-group "$RG" \
            --name "migrate-$GITHUB_RUN_ID" \
            --template-file infra/apps.bicep \
            --parameters "@$RUNNER_TEMP/apps.parameters.json" \
            --parameters migrateOnly=true \
            --output none

      - name: Run migrations
        run: |
          execution="$(az containerapp job start --resource-group "$RG" --name "$MIGRATE_JOB" --query name --output tsv)"
          echo "Started $MIGRATE_JOB execution $execution"
          for _ in $(seq 1 60); do
            status="$(az containerapp job execution show --resource-group "$RG" --name "$MIGRATE_JOB" \
              --job-execution-name "$execution" --query properties.status --output tsv)"
            case "$status" in
              Succeeded) echo "Migrations applied."; exit 0 ;;
              Failed|Stopped|Degraded)
                echo "::error::Migration $execution ended as $status. Logs: Azure portal → $MIGRATE_JOB → Execution history."
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Migration $execution did not finish within 10 minutes."
          exit 1

      - name: Deploy apps
        run: |
          az deployment group create \
            --resource-group "$RG" \
            --name "apps-$GITHUB_RUN_ID" \
            --template-file infra/apps.bicep \
            --parameters "@$RUNNER_TEMP/apps.parameters.json" \
            --parameters migrateOnly=false \
            --output none

      - name: Remove parameter file
        if: always()
        run: rm -f "$RUNNER_TEMP/apps.parameters.json"

      - name: Smoke check
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
            "$API_URL/health"
          echo
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
            --output /dev/null "$APP_URL/"
          echo "web and api are up: $APP_URL  $API_URL"
