name: Migrate

# Applies committed Prisma migrations to the production database. Railway
# rebuilds the api/worker images on push-to-main but never runs migrations,
# so this workflow is the one place schema changes reach the database.
#
# Runs automatically when a new migration lands on main, and can be run
# manually (workflow_dispatch) — e.g. after adding the DATABASE_URL secret
# or to re-apply after a failed run.
#
# Requires the repo secret PROD_DATABASE_URL (Railway → Postgres →
# DATABASE_PUBLIC_URL). Deliberately a separate secret from anything CI
# uses so a compromised CI run can't reach production data.
#
# NOTE: migrations must be backward compatible with the currently deployed
# code — this job and the Railway rebuild race each other by design
# (expand/contract pattern; see docs/RUNBOOK.md).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/db/prisma/migrations/**'

# Never run two migrate jobs against production concurrently, and never
# cancel one mid-flight.
concurrency:
  group: migrate-production
  cancel-in-progress: false

env:
  NODE_VERSION: 20
  PNPM_VERSION: 9.12.0

jobs:
  migrate:
    name: prisma migrate deploy (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail early if PROD_DATABASE_URL is not configured
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "::error::Repo secret PROD_DATABASE_URL is not set — cannot migrate."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show pending migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        # `migrate status` exits non-zero when migrations are pending — that's
        # exactly the case we're here for, so don't fail the job on it.
        run: pnpm --filter @areyouagentic/db exec prisma migrate status || true

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm --filter @areyouagentic/db exec prisma migrate deploy
